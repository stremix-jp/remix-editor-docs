<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>remix-editor Documentation</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // ブラウザ言語で /ja/ か /en/ へ振り分ける（JS 無効時は下のリンクを表示）
      var lang = (navigator.language || 'en').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en';
      location.replace('/' + lang + '/');
    </script>
    <style>
      /* この 1 枚は VitePress の外（public/ の素の HTML）なので、テーマの CSS が届かない。
         値の出所は stremix-ui/src/theme/theme.css（SSOT。複製は静的ページ都合）。
         規則: 地は surface-base の灰、brand は var 参照、面ファミリーは light↔dark 1対1。
         ここは静的ページなので OS 設定（prefers-color-scheme）追従。 */
      :root {
        --surface-base: #f2f2f2;
        --foreground: oklch(0.35 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --brand: #99acea;
        --brand-from: #7ab8fc;
        --brand-to: #f687b3;
        --sans: "Inter Variable", "Inter", ui-sans-serif, system-ui, "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface-base: #2b2937;
          --foreground: oklch(0.985 0 0);
          --muted-foreground: oklch(0.72 0.02 292);
          --brand: #6a7aad;
          --brand-from: #4f83bc;
          --brand-to: #b65a80;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--surface-base);
        color: var(--foreground);
        font-family: var(--sans);
        line-height: 1.9;
      }
      .box { padding: 1.5rem 1.25rem; text-align: center; }
      /* ロゴは light / dark の 2 枚構成（1 枚の色反転使い回し禁止） */
      .logo { display: block; height: 28px; width: auto; margin: 0 auto; }
      .logo-dark { display: none; }
      @media (prefers-color-scheme: dark) {
        .logo-light { display: none; }
        .logo-dark { display: block; }
      }
      .rule {
        height: 3px;
        width: 64px;
        margin: 0.8rem auto 1.1rem;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--brand-from), var(--brand-to));
      }
      h1 { font-size: 1.05rem; font-weight: 700; color: var(--foreground); margin: 0 0 0.2rem; line-height: 1.45; }
      p { margin: 0.2rem 0 0; font-size: 0.8rem; color: var(--muted-foreground); }
      /* リンクは本文色 + brand の下線で示す */
      a {
        color: var(--foreground);
        text-decoration: underline;
        text-decoration-color: var(--brand);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.25em;
        font-size: 0.9rem;
        margin: 0 0.6rem;
      }
      a:hover { text-decoration-thickness: 2px; }
    </style>
  </head>
  <body>
    <div class="box">
      <img class="logo logo-light" src="/logo.svg" alt="すとりみっくす！" height="28" />
      <img class="logo logo-dark" src="/logo-dark.svg" alt="すとりみっくす！" height="28" />
      <div class="rule"></div>
      <h1>remix-editor ドキュメント</h1>
      <noscript>
        <p><a href="/ja/">日本語</a> | <a href="/en/">English</a></p>
      </noscript>
    </div>
  </body>
</html>
